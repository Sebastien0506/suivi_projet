<div class="delete_objectif">
    <p>Êtes-vous sûr de vouloir supprimer cet objectif ?</p>

    <div class="buttons">
        <button type="button" mat-stroked-button (click)="closeDialog()">
            Annuler
        </button>

        <button type="button" mat-raised-button class="confirm-delete" (click)="deleteObjectif()">
            Supprimer
        </button>
    </div>
</div>
