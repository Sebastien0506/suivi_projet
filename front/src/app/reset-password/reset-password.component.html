<div class="pageResetPassword">
    <div class="card_form">
        <h6>Renseigner votre nouveaux mot de passe</h6>
        <form class="form" (ngSubmit)="sendRequest()">
            <mat-form-field>
                <mat-label>Nouveaux mot de passe</mat-label>
                <input type="text" matInput [formControl]="passwordInput">
            </mat-form-field>
            <button mat-raised-button type="submit">Enregistrez</button>
        </form>
    </div>
    
</div>
