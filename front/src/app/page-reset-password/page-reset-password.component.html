<!-- PAGE POUR RENSEIGNER L'EMAIL POUR LA RÉINITIALISATION DU MOT PASSE -->

<div class="pageResetPassword">
    <div class="card_form">
        <h6>Renseigner votre adresse email</h6>
        <form class="form" (ngSubmit)="sendRequest()">
            <mat-form-field>
                <mat-label>Email</mat-label>
                <input type="text" matInput [formControl]="emailInput">
            </mat-form-field>
            <button mat-raised-button>Envoyer</button>
        </form>
    </div>
    
</div>
