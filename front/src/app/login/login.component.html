<div class="pageConnexion">
    <div class="card_form">
        <form class="form" (ngSubmit)="sendRequest()">
            <h6>Connexion</h6>
            <mat-form-field>
                <mat-label>Email</mat-label>
                <input type="text" matInput [formControl]="emailInput">
            </mat-form-field>
            
            <mat-form-field>
                <mat-label>Password</mat-label>
                <input type="password" matInput [formControl]="passwordInput">
            </mat-form-field>
            <button mat-raised-button type="submit">Connexion</button>
        </form>
        <button mat-raised-button routerLink="/pageResetPassword">Mot de passe oublier ?</button>
    </div>
    

    
</div>
